const CASES=[{"title":"Le piège de la réussite grammaticale","level":"5e","focus":"Prétérit : exercice réussi, transfert incertain","context":"Une classe de 5e (28 élèves) travaille à partir d’un carnet de voyage fictif. Après un repérage des verbes au passé, le professeur propose dix phrases à compléter puis une courte production personnelle. Les documents sont construits pour la formation.","objective":"Raconter deux événements passés en reliant forme, sens et chronologie.","transcript":[["T","Look at the verbs in the diary. What do you notice?"],["S1","They finish with -ed."],["T","All of them? Look at “went”."],["S2","It is not -ed."],["T","Now complete the sentences."],["S3","I got ten out of ten!"],["T","Tell your partner what you did last weekend."],["S3","I go to the park and I play football yesterday."]],"traces":[["A — exercice guidé","10/10 formes correctes dans des phrases à trous."],["A — production spontanée","“Yesterday I go to the park and I play football.”"],["B — exercice guidé","6/10 ; hésitations sur went / saw."],["B — production personnelle","“Last Saturday, I went to the market and bought a book.”"]],"dilemma":"La réussite de l’exercice permet-elle de conclure à la maîtrise du prétérit ?","analysis":["L’élève A réussit en contexte fortement guidé mais ne réinvestit pas les formes dans l’énoncé cité.","L’élève B réussit moins l’exercice mais mobilise deux formes pertinentes dans sa production.","Ces traces ne suffisent pas à établir une compétence stabilisée ; il faudrait des observations répétées, des tâches comparables et une analyse des aides reçues."],"alternatives":["Prévoir une tâche intermédiaire de transformation puis une production personnelle étayée.","Recueillir une trace individuelle différée pour apprécier la mobilisation autonome."],"refs":"Programmes d’anglais applicables en 5e (BO 2025) ; référentiel professionnel P3 et P5 ; CECRL, activités de production."},{"title":"Interpréter le silence en classe","level":"4e","focus":"Interaction : interpréter le silence sans juger","context":"En 4e, après l’écoute d’un court témoignage sur un engagement citoyen, l’enseignante demande une réaction orale collective. Trois élèves interviennent ; les autres restent silencieux.","objective":"Exprimer et justifier une opinion simple en interaction.","transcript":[["T","So, what do you think about the speaker’s decision?"],["Classe","[Silence pendant huit secondes.]"],["T","Come on, you know the answer."],["S1","I think it is good."],["T","Why?"],["S1","Because… I don’t know how to say."],["S2, à voix basse","We need some words."],["T","Anyone else?"],["Classe","[Deux mains se lèvent.]"]],"traces":[["Brouillon de C","“I agree because it helps people.”"],["Note de D","“I don’t agree / dangerous / too young”"],["Observation","Aucun temps de préparation individuelle avant l’échange collectif."]],"dilemma":"Le silence signale-t-il un défaut d’intérêt, de compréhension, de ressources ou de sécurité de prise de parole ?","analysis":["Le verbatim montre une demande de ressources lexicales ; ce n’est pas une preuve générale d’incompréhension.","Des notes écrites montrent que certains élèves ont des idées sans les verbaliser en collectif.","La participation orale visible n’est pas un indicateur suffisant des apprentissages de toute la classe."],"alternatives":["Prévoir 90 secondes de réflexion puis un échange en binômes avant la mise en commun.","Fournir des amorces d’énoncés et varier les modalités de recueil de réponses."],"refs":"Programme de cycle 4 applicable en 4e en 2026-2027 ; CECRL interaction orale ; référentiel P3 et P4."},{"title":"Les limites du travail de groupe","level":"5e","focus":"Coopération : participation visible et apprentissage individuel","context":"Quatre élèves préparent une affiche sur une école britannique. Le professeur circule ; le groupe produit une affiche réussie en douze minutes.","objective":"Comparer des éléments de vie scolaire et contribuer à une production collective.","transcript":[["T","Work in groups of four. Make a poster."],["S1","I will write. You find pictures."],["S2","I can do the timetable."],["S3","What should I do?"],["S1","Just colour the title."],["S4","I’m finished."],["T","Great poster, well done!"]],"traces":[["Affiche collective","Présentation claire ; cinq informations exactes."],["Ticket individuel S1","Peut expliquer trois différences entre deux écoles."],["Ticket individuel S3","Ne peut expliquer qu’un élément de l’affiche."]],"dilemma":"Peut-on inférer l’apprentissage de chacun à partir d’une bonne production de groupe ?","analysis":["Le produit collectif est satisfaisant, mais la distribution des responsabilités limite la contribution linguistique de S3.","Les tickets individuels constituent des indices partiels d’apprentissages différenciés.","L’attribution de rôles n’est utile que si elle crée des responsabilités cognitives et langagières réelles."],"alternatives":["Distribuer des informations complémentaires et exiger une restitution individuelle courte.","Prévoir des rôles tournants et un temps d’explication réciproque."],"refs":"Référentiel P3, P4 et P5 ; CECRL interaction et médiation ; programmes d’anglais 5e."},{"title":"Quand les consignes font obstacle","level":"6e","focus":"Consignes : comprendre la tâche et le résultat attendu","context":"Une 6e doit associer des descriptions orales à des personnages puis comparer ses réponses. La consigne est donnée rapidement, sans exemple.","objective":"Identifier des informations simples dans un document oral et confronter ses réponses.","transcript":[["T","Listen, match, compare, correct and then write a short description. You have five minutes."],["S1","Do we write now?"],["T","I just explained."],["S2, à S3","Which picture?"],["S3","I don’t know."],["T","Why haven’t you started?"],["S2","We don’t know what to do first."]],"traces":[["Feuille A","Aucun appariement ; une phrase de description commencée."],["Feuille B","Appariements complets ; aucune comparaison indiquée."],["Observation","Trois actions distinctes annoncées dans une seule consigne."]],"dilemma":"L’absence de mise au travail permet-elle de conclure à un manque d’attention ?","analysis":["Les questions des élèves indiquent une incertitude sur l’ordre des actions et le support.","L’énoncé regroupe plusieurs tâches ; l’obstacle peut être organisationnel plutôt que linguistique.","Il faut vérifier la compréhension par une démonstration ou une reformulation active."],"alternatives":["Segmenter les consignes et afficher des pictogrammes numérotés.","Faire réaliser un exemple, puis demander à un élève de reformuler la première action."],"refs":"Programmes d’anglais 6e (BO 2025) ; référentiel P3 et P4 ; ressources Éduscol."},{"title":"Une séance réussie en apparence ?","level":"3e","focus":"Séance fluide : quels indices d’apprentissage ?","context":"En 3e, les élèves préparent un court plaidoyer sur une question environnementale. La séance se déroule sans incident et les productions finales sont soignées.","objective":"Défendre un point de vue avec des arguments et des connecteurs.","transcript":[["T","You have fifteen minutes to prepare your speech."],["S1","Can we use the model?"],["T","Yes, it’s on the board."],["S2","Let’s copy the beginning."],["T","Time is up. Excellent presentations!"],["S3, après la séance","I read the text but I couldn’t answer questions."]],"traces":[["Discours collectif","Arguments cohérents, plusieurs phrases reprises du modèle."],["Question individuelle","Deux élèves sur quatre ne peuvent reformuler leur argument principal."],["Observation","Évaluation centrée sur le produit oral collectif."]],"dilemma":"Quels éléments permettent de distinguer performance préparée et appropriation individuelle ?","analysis":["Une séance sans incident ne renseigne pas directement sur l’apprentissage.","Le modèle peut être un étayage utile, mais sa reprise limite ce qu’on peut inférer sur l’autonomie.","Une question individuelle ou une nouvelle situation de transfert fournirait d’autres indices."],"alternatives":["Ajouter une phase de reformulation individuelle sans modèle.","Prévoir une réponse à une question imprévue après les présentations."],"refs":"Programme de cycle 4 applicable en 3e en 2026-2027 ; CECRL production et interaction ; référentiel P5."},{"title":"Le dilemme de la différenciation","level":"4e","focus":"Différenciation : étayer sans abaisser l’objectif","context":"En 4e, une activité d’interaction consiste à comparer deux itinéraires touristiques. Un groupe reçoit une fiche avec des questions toutes rédigées ; un autre doit inventer les siennes.","objective":"Demander et comparer des informations pour choisir un itinéraire.","transcript":[["T","Group A, use the questions on your sheet. Group B, make your own."],["S1","We just read the questions?"],["T","Yes."],["S2","Can we have a model too?"],["T","You are the advanced group."],["S3","Our group finished in three minutes."],["S4","We are still trying to make the first question."]],"traces":[["Groupe A","Questions correctement lues ; peu de reformulations."],["Groupe B","Deux questions produites ; interaction non terminée."],["Observation","Les aides et la charge cognitive diffèrent fortement entre les groupes."]],"dilemma":"Comment différencier l’accès à une tâche sans renoncer à une ambition langagière commune ?","analysis":["Les deux groupes n’exercent pas exactement les mêmes opérations langagières.","L’aide peut faciliter l’accès, mais une fiche intégralement scriptée peut réduire les occasions de formulation autonome.","La différenciation doit articuler objectif partagé, aides ajustables et critères de réussite communs."],"alternatives":["Proposer des amorces facultatives et progressivement retirables.","Prévoir une étape commune de transfert avec un nouveau partenaire."],"refs":"Référentiel P3 et P4 ; programme de cycle 4 applicable en 4e ; CECRL interaction."}];
const MISSIONS=[['Observer et questionner',15,'Partir d’une situation de stage et expliciter ses représentations.'],['Analyser l’enseignement de la grammaire',40,'Comparer deux démarches à partir d’un objectif commun.'],['Les formes de travail : choisir et justifier',40,'Comparer les organisations individuelles, en binômes, en groupes et en classe entière.'],['Les consignes : analyser, reformuler, vérifier',40,'Trois exercices distincts : diagnostic, réécriture et vérification.'],['Concevoir une situation d’apprentissage',55,'Articuler grammaire, communication, modalités et évaluation.'],['Analyser, réviser et préparer le présentiel',40,'Réviser sa préparation et préparer un transfert en stage.']];
const STORAGE='teacherlab_v6_brot2you';const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let data;try{data=JSON.parse(localStorage.getItem(STORAGE))||{}}catch{data={}};data.answers??={};data.done??={};data.cases??={};data.reviewed??={};let current='home';
function save(){try{localStorage.setItem(STORAGE,JSON.stringify(data))}catch{toast('Stockage local indisponible : exportez votre sauvegarde.')}refreshNav()}
function toast(s){let t=$('toast');t.textContent=s;t.classList.remove('hidden');clearTimeout(window._toast);window._toast=setTimeout(()=>t.classList.add('hidden'),3000)}
function bindFields(){document.querySelectorAll('[data-answer]').forEach(el=>{let k=el.dataset.answer;el.value=data.answers[k]??'';el.addEventListener('input',()=>{data.answers[k]=el.value;save();let wc=el.parentNode.querySelector('.wordcount');if(wc)wc.textContent=el.value.trim().split(/\s+/).filter(Boolean).length+' mots';});let wc=el.parentNode.querySelector('.wordcount');if(wc)wc.textContent=el.value.trim().split(/\s+/).filter(Boolean).length+' mots'});document.querySelectorAll('[data-done]').forEach(el=>{el.checked=!!data.done[el.dataset.done];el.onchange=()=>{data.done[el.dataset.done]=el.checked;save();toast(el.checked?'Mission validée':'Mission rouverte')}})}
function field(k,label,hint='',rows=5){return `<div class="field"><label for="${k}">${label}</label>${hint?`<small>${hint}</small>`:''}<textarea id="${k}" rows="${rows}" data-answer="${k}" placeholder="Rédigez ici votre réponse argumentée…"></textarea><div class="wordcount"></div></div>`}
function intro(obj,docs,cons,production,criteria){return `<section class="panel"><h2>Votre travail</h2><p><strong>Objectif de formation :</strong> ${obj}</p><p><strong>Documents à examiner :</strong> ${docs}</p><div class="instruction"><h3>Consigne</h3>${cons}</div><div class="outcome"><strong>Production attendue :</strong> ${production}</div><p class="hint"><strong>Critères de réussite :</strong> ${criteria}</p></section>`}
function feedback(id,body){return `<div class="actions"><button class="btn secondary" data-feedback="${id}">◉ Afficher les points de vigilance</button></div><div class="feedback hidden" id="f-${id}"><h3>Repères pour l’autoévaluation</h3>${body}</div>`}
function renderNav(){let items=[['home','⌂','Accueil'],...MISSIONS.map((m,i)=>['m'+i,String(i+1),m[0]]),['cases','⌕','Dossiers d’observation'],['liaison','✦','Fiche de liaison'],['portfolio','▣','Livret et dépôt'],['resources','≡','Ressources']];$('nav').innerHTML=items.map(([id,n,t])=>`<button data-go="${id}" class="${current===id?'active':''}"><span class="n">${n}</span>${esc(t)}${id.startsWith('m')&&data.done[id.slice(1)]?' ✓':''}</button>`).join('');document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go))}
function refreshNav(){renderNav();$('progressPill').textContent=Object.values(data.done).filter(Boolean).length+' / 6 missions'}
function go(id){current=id;renderNav();$('breadcrumb').textContent=id.startsWith('m')?'Mission '+(+id.slice(1)+1)+' · M1 M2E anglais':'Parcours de formation · M1 M2E anglais';let html=id==='home'?home():id==='cases'?caseHome():id==='portfolio'?portfolio():id==='liaison'?liaison():id==='resources'?resources():id.startsWith('case')?caseView(+id.slice(4)):id.startsWith('m')?mission(+id.slice(1)):home();$('view').innerHTML=html;bindFields();document.querySelectorAll('[data-feedback]').forEach(b=>b.onclick=()=>{let f=$('f-'+b.dataset.feedback);f.classList.toggle('hidden');b.textContent=f.classList.contains('hidden')?'◉ Afficher les points de vigilance':'◉ Masquer les points de vigilance'});document.querySelectorAll('[data-next]').forEach(b=>b.onclick=()=>go(b.dataset.next));document.querySelectorAll('[data-open-case]').forEach(b=>b.onclick=()=>go('case'+b.dataset.openCase));window.scrollTo(0,0)}
function home(){let count=Object.values(data.done).filter(Boolean).length;return `<section class="hero"><div class="hero-inner"><span class="eyebrow">Formation initiale · Didactique de l’anglais · Collège</span><h1>TEACHER LAB<em>The Teaching Quest</em></h1><p>Comment faire travailler un point de grammaire au collège, avec une organisation et des consignes qui permettent réellement aux élèves d’apprendre ?</p><button class="btn" data-next="m${Math.min(count,5)}">▶ ${count?'Reprendre le parcours':'Commencer la formation'}</button></div></section><div class="stats"><div class="stat"><strong>une séance</strong><small>Parcours à votre rythme</small></div><div class="stat"><strong>${count} / 6</strong><small>Missions validées</small></div><div class="stat"><strong>1 livret</strong><small>Livret unique à déposer sur Digipad</small></div></div><section class="panel" style="margin-top:18px;border-left:5px solid #d7a04c"><h2>Votre livret de formation</h2><p><strong>Un seul document à compléter et à déposer sur Digipad.</strong> Travaillez dans le livret modifiable ou imprimez la version PDF. Conservez vos choix, vos hésitations et les modifications apportées à vos propositions. Votre fiche de liaison servira à préparer la prochaine séance en présentiel.</p><div class="actions"><a class="btn" href="TEACHER_LAB_Livret_Etudiant_V8.docx" download>↓ Livret modifiable (DOCX)</a><a class="btn secondary" href="TEACHER_LAB_Livret_Etudiant_V8.pdf" download>↓ Livret imprimable (PDF)</a><button class="btn secondary" data-next="liaison">✦ Préparer le présentiel</button></div><p class="hint">Le dépôt sur Digipad s'effectue séparément : l’application ne transmet aucun fichier automatiquement.</p></section><h2 class="section-title">Votre parcours</h2><p class="lead">Un même problème professionnel traverse les six missions : observer, comparer, décider, concevoir puis réviser. Toutes les activités obligatoires sont réalisables individuellement.</p><div class="route-track" aria-label="Les six étapes du parcours">${MISSIONS.map((m,i)=>`<button class="route-stop ${data.done[i]?'route-done':''}" data-next="m${i}" aria-label="Ouvrir la mission ${i+1} : ${esc(m[0])}"><span class="route-number">${i+1}</span><span class="route-name">${esc(m[0])}</span></button>`).join('')}</div><div class="mission-grid" style="margin-top:18px">${MISSIONS.map((m,i)=>`<article class="mission-card"><div class="band"></div><div class="inner"><div class="num">MISSION ${i+1} ${data.done[i]?'· ✓ VALIDÉE':''}</div><h3>${esc(m[0])}</h3><p>${esc(m[2])}</p></div><footer><button class="btn secondary" data-next="m${i}">Ouvrir la mission →</button></footer></article>`).join('')}</div><section class="panel"><h2>Avant de commencer</h2><p>Prévoyez un temps de travail individuel, consultez les ressources lorsque cela est demandé et rédigez vos réponses directement dans l’application. Elles sont sauvegardées dans ce navigateur.</p><p><strong>À déposer sur Digipad :</strong> un portfolio unique comprenant vos analyses, votre préparation de séance, sa révision argumentée et votre protocole de transfert en stage.</p><p class="hint">Les six dossiers fictifs de l’Observatoire constituent une banque de matériaux complémentaires. Ils ne s’ajoutent pas aux une séance obligatoires.</p><div class="actions"><button class="btn dark" data-next="portfolio">Voir mon portfolio</button><button class="btn secondary" data-next="cases">Explorer les dossiers fictifs</button></div></section>`}
function mission(i){let m=MISSIONS[i];return `<div class="back"><button class="btn secondary" data-next="home">← Retour au parcours</button></div><header class="mission-head"><span class="meta">MISSION ${i+1} / 6 · SÉANCE À DISTANCE</span><h1>${esc(m[0])}</h1><p>${esc(m[2])}</p></header><div class="steps"><span>Lire les documents</span><span>Analyser</span><span>Rédiger</span><span>Relire et valider</span></div>${missionContent(i)}${i>=1&&i<=4?`<section class="panel"><h2>Justifier et préparer la discussion</h2><p>Conservez les raisons de votre choix et une question que vous souhaiteriez confronter en présentiel.</p>${field('m'+(i+1)+'-choice','Je retiens cette proposition parce que…','Appuyez votre choix sur les objectifs et les indices disponibles.',3)}${field('m'+(i+1)+'-limit','Sa principale limite est…','Précisez un risque ou une condition de validité.',3)}${field('m'+(i+1)+'-alternative','Une autre possibilité serait…','Présentez un compromis ou une solution différente.',3)}${field('m'+(i+1)+'-debate','Je voudrais discuter en présentiel de…','Formulez une question professionnelle précise.',3)}</section>`:''}<section class="panel"><h2>Terminer la mission</h2><p>Relisez vos réponses : sont-elles argumentées et appuyées sur des éléments précis ? La validation signale votre progression ; elle ne constitue pas une notation automatique.</p><label class="checkrow"><input type="checkbox" data-done="${i}"> J’ai terminé et relu les productions attendues.</label><div class="footerbar"><button class="btn secondary" data-next="${i?'m'+(i-1):'home'}">← Précédent</button><button class="btn" data-next="${i<5?'m'+(i+1):'liaison'}">${i<5?'Mission suivante →':'Préparer le présentiel →'}</button></div></section>`}
function missionContent(i){return [m1,m2,m3,m4,m5,m6][i]()}
function m1(){return intro('Distinguer les faits observables, les interprétations et les représentations initiales.','Une situation de stage observée ou conduite ; à défaut, une activité de manuel ou un souvenir scolaire précisément situé.',`<ol><li>Choisissez un moment où les élèves ont travaillé un point de grammaire.</li><li>Décrivez le contexte, les objectifs, l’activité réelle des élèves, les modalités et la consigne.</li><li>Identifiez un indice de compréhension ou une difficulté.</li><li>Réagissez aux trois affirmations proposées, en deux ou trois phrases chacune.</li></ol>`, 'Une description courte et trois prises de position argumentées.', 'Précision des faits ; distinction entre observation et interprétation ; argumentation nuancée.')+`<section class="panel"><h2>1. Situation de stage</h2><p class="hint">Anonymisez les personnes et l’établissement. Si vous utilisez un autre support, indiquez-le explicitement.</p>${field('m1-context','Classe, point de langue et origine de la situation','Niveau, support, point de grammaire ; observation réelle ou situation de substitution.',3)}${field('m1-objective','Ce que les élèves devaient apprendre à faire','Distinguez l’objectif grammatical de l’objectif de communication.',3)}${field('m1-activity','Ce que les élèves ont effectivement fait','Décrivez les actions observables sans attribuer d’intentions.',4)}${field('m1-modes','Modalités de travail et consigne donnée','Reconstituez la consigne aussi fidèlement que possible.',3)}${field('m1-evidence','Un indice de compréhension ou une difficulté','Citez un fait ou une production ; indiquez ce qu’il ne permet pas de conclure.',3)}</section><section class="panel"><h2>2. Mes représentations initiales</h2>${field('m1-belief1','« Pour apprendre la grammaire, il faut commencer par expliquer la règle. »','Prenez position en deux ou trois phrases.',3)}${field('m1-belief2','« Faire travailler les élèves en groupes les rend actifs. »','Prenez position en deux ou trois phrases.',3)}${field('m1-belief3','« Si les élèves ne commencent pas, c’est qu’ils n’ont pas écouté la consigne. »','Prenez position en deux ou trois phrases.',3)}<p class="hint">Il n’y a pas de correction immédiate : vous reviendrez sur ces réponses à la mission 6.</p></section>`}
function m2(){return intro('Analyser la place du sens, de la forme et de l’emploi dans deux démarches d’enseignement grammatical.','Deux scénarios fictifs sur la formulation de questions au présent simple dans un échange avec des correspondants britanniques.',`<ol><li>Identifiez l’objectif grammatical et l’objectif de communication.</li><li>Repérez quand les élèves travaillent le sens, la forme et l’emploi.</li><li>Comparez les opérations intellectuelles demandées.</li><li>Discutez les intérêts et limites de chaque scénario.</li><li>Proposez une amélioration argumentée de chacun.</li></ol>`, 'Une comparaison structurée et deux propositions d’amélioration.', 'Analyse contextualisée ; distinction induction/déduction ; refus d’un classement simpliste.')+`<section class="panel"><h2>Documents : deux scénarios de séance</h2><div class="compare"><div class="doc"><h4>Scénario A · La règle puis l’application</h4><ol><li>Le professeur présente la construction des questions au présent simple : auxiliaire, sujet, base verbale.</li><li>Les élèves recopient la règle et deux exemples.</li><li>Ils transforment dix phrases affirmatives en questions.</li><li>Correction en classe entière.</li><li>Ils rédigent trois questions à poser à un correspondant sur ses habitudes.</li></ol></div><div class="doc"><h4>Scénario B · Observer, comprendre, utiliser</h4><ol><li>Les élèves lisent un échange entre deux adolescents sur leurs habitudes.</li><li>Ils identifient les informations puis les questions.</li><li>Ils comparent les formes et formulent une hypothèse.</li><li>Le professeur explicite et stabilise la règle.</li><li>Entraînement guidé, puis échanges de questions entre élèves.</li></ol></div></div><div class="doc"><h4>Support linguistique commun (extrait fictif)</h4><blockquote>“What do you do after school?” — “I usually play football.”<br>“Does your sister play too?” — “No, she doesn't. She reads.”</blockquote><p>Les élèves devront distinguer la construction des questions avec <em>do/does</em>, la base verbale et le sens des habitudes.</p></div></section><section class="panel"><h2>Votre analyse comparative</h2>${field('m2-goals','1. Objectifs grammatical et de communication','Nommez les deux objectifs sans les confondre.',4)}${field('m2-form','2. Place du sens, de la forme et de l’emploi','Comparez les étapes précises des deux scénarios.',5)}${field('m2-cognitive','3. Opérations intellectuelles demandées','Repérer, appliquer, comparer, formuler une hypothèse, choisir une formulation…',4)}${field('m2-limits','4. Intérêts, limites et conditions de pertinence','Dans quelles circonstances une explication directe aide-t-elle ? Quand l’induction devient-elle une devinette ?',6)}${field('m2-improve','5. Deux améliorations argumentées','Proposez une amélioration pour A et une pour B.',5)}${feedback('m2',`<ul><li>Une démarche <strong>déductive</strong> part de la règle vers ses applications ; une démarche <strong>inductive</strong> part d’exemples vers des régularités.</li><li>L’<strong>explicitation</strong> peut intervenir après une recherche inductive.</li><li>Dans les deux scénarios, examinez les aides, la compréhension du sens, les occasions de réemploi et la vérification individuelle.</li><li>Ne concluez pas que B est toujours supérieur à A.</li></ul>`)}</section>`}
function m3(){const phases=[['Observer des exemples','Repérer des régularités dans des questions sur les habitudes.'],['Proposer une explication','Formuler une hypothèse sur la construction des questions.'],['S’entraîner','Construire des questions au présent simple.'],['Utiliser les questions','Interroger un camarade pour découvrir ses habitudes.'],['Vérifier les acquis','Produire individuellement une question nouvelle.']];return intro('Comparer les formes de travail et justifier leur pertinence pour un objectif précis.','Une même activité grammaticale : apprendre à poser des questions sur les habitudes.',`<ol><li>Pour chacune des cinq phases, choisissez entre travail individuel, binômes, petits groupes ou classe entière.</li><li>Justifiez la forme choisie : que fait chaque élève, que fait le professeur et qu’apporte l’interaction ?</li><li>Anticipez un risque et un ajustement réaliste.</li><li>Comparez deux organisations différentes pour la phase d’observation.</li></ol>`,'Une grille argumentée et une comparaison de deux organisations.','Le choix dépend de l’objectif et de l’activité réelle de chaque élève, pas d’une modalité idéale.')+`<section class="panel"><h2>Atelier · Les quatre formes de travail</h2><div class="mode-key"><span>Travail individuel</span><span>Binômes</span><span>Petits groupes</span><span>Classe entière</span></div><p class="hint">Chaque phase fait l’objet d’une proposition distincte. Indiquez précisément ce que chaque élève doit faire.</p>${phases.map((p,i)=>`<article class="phase-card"><div class="phase-card-title"><span class="phase-index">${i+1}</span><div><h3>${p[0]}</h3><p>${p[1]}</p></div></div><div class="subgrid">${field('m3-'+i+'-mode','Forme de travail et justification','Choisissez une forme et justifiez-la en fonction de l’objectif.',3)}${field('m3-'+i+'-actors','Activité de chaque élève et rôle du professeur','Quelles opérations intellectuelles et langagières ? Quel accompagnement ?',3)}</div><div class="subgrid">${field('m3-'+i+'-risk','Risque et ajustement','Qu’est-ce qui peut empêcher l’apprentissage ? Comment agir ?',3)}${field('m3-'+i+'-trace','Indice individuel d’apprentissage','Quelle trace permet de savoir ce que chacun a appris ?',3)}</div></article>`).join('')}</section><section class="panel"><h2>Comparer deux organisations</h2><div class="doc"><h4>Même objectif, deux choix</h4><p><strong>Option A.</strong> Recherche individuelle, puis confrontation en binôme.</p><p><strong>Option B.</strong> Recherche directement menée en petits groupes.</p></div>${field('m3-compare-a','Option A : intérêts et limites','Que gagne-t-on avec une recherche individuelle préalable ?',4)}${field('m3-compare-b','Option B : intérêts et limites','Qu’apporte la recherche directement collective ? Quels risques ?',4)}${field('m3-tradeoff','Mon arbitrage professionnel','Dans ce contexte, quelle organisation retiendriez-vous et pourquoi ?',4)}${feedback('m3',`<ul><li>Un binôme ne garantit pas que chacun mobilise la langue.</li><li>Une recherche individuelle peut rendre visibles des hypothèses avant confrontation.</li><li>Une mise en commun peut stabiliser une règle, sans suffire à vérifier les acquis de chacun.</li><li>Une modalité n’est pertinente que si elle soutient l’objectif et l’activité des élèves.</li></ul>`)}</section>`}
function m4(){const prompts=['Work in groups and talk about your habits.','Look at the sentences. What can you notice?','Ask your partner questions and write.'];return intro('Apprendre à analyser, reformuler et vérifier la compréhension des consignes.','Trois consignes fictives volontairement incomplètes pour des classes de collège.',`<ol><li>Exercice 1 : diagnostiquez les ambiguïtés de chaque consigne.</li><li>Exercice 2 : reformulez chacune en anglais pour un niveau de collège choisi ; précisez ce que vous montreriez ou afficheriez.</li><li>Exercice 3 : construisez un dispositif de vérification pour une consigne et anticipez un malentendu.</li></ol>`,'Trois diagnostics, trois versions révisées et un dispositif détaillé de vérification.','Différencier compréhension de la tâche et réussite grammaticale ; rendre les consignes opératoires.')+`<section class="panel"><h2>Exercice 1 · Diagnostiquer</h2><p class="hint">Pour chaque proposition, identifiez ce que l’élève pourrait faire, ce qui reste ambigu et ce qu’il faut préciser.</p>${prompts.map((p,i)=>`<article class="instruction-case"><div class="instruction-case-title"><span class="phase-index">${i+1}</span><strong>Consigne initiale</strong></div><blockquote lang="en">${esc(p)}</blockquote>${field('m4-'+i+'-diag','Diagnostic : ambiguïtés et malentendus','Que peut comprendre l’élève ? Que manque-t-il ?',4)}</article>`).join('')}</section><section class="panel"><h2>Exercice 2 · Réécrire en anglais</h2><p class="hint">Pour chacune des trois consignes, choisissez une classe de collège et conservez la formulation initiale pour rendre visible votre révision.</p>${prompts.map((p,i)=>`<article class="instruction-case"><div class="instruction-case-title"><span class="phase-index">${i+1}</span><strong>Proposition révisée</strong></div><p class="small-original" lang="en">${esc(p)}</p>${field('m4-'+i+'-rewrite','Version révisée en anglais','Rédigez la consigne exacte adressée aux élèves.',4)}${field('m4-'+i+'-display','Ce que je montrerais ou afficherais','Support, exemple, ordre des actions, temps, résultat attendu.',3)}${field('m4-'+i+'-why','Pourquoi cette modification ?','Expliquez le changement et son effet attendu.',3)}</article>`).join('')}</section><section class="panel"><h2>Exercice 3 · Vérifier la compréhension</h2><div class="doc"><h4>Exemple d’une consigne d’interview</h4><blockquote lang="en">“Work in pairs. Ask your partner the three questions on your card. Write down their answers. Then swap roles. You have four minutes.”</blockquote><p>Deux vérifications possibles : “Do you write your answers or your partner’s answers?” et “Who asks the questions first?”</p></div>${field('m4-demo','Démonstration ou exemple','Que montrerez-vous concrètement avant le démarrage ?',4)}${field('m4-questions','Deux questions de vérification','Vérifiez ce que les élèves doivent faire, et non la règle grammaticale.',4)}${field('m4-misunderstanding','Malentendu plausible et réponse professionnelle','Imaginez une réaction d’élève et votre ajustement.',4)}${feedback('m4',`<ul><li>Une consigne indique une action, un support et un résultat attendu.</li><li>Tout n’a pas à être dit : une démonstration peut éviter une longue explication.</li><li>« Does everybody understand? » ne vérifie pas la compréhension effective.</li><li>Comparer l’action attendue et l’action réellement comprise.</li></ul>`)}</section>`}
function m5(){return intro('Concevoir un segment cohérent articulant apprentissages grammaticaux, communication et organisation.','Les productions des missions 2, 3 et 4 : grammaire, formes de travail et consignes.',`<ol><li>Concevez un segment de séance de 20 à 25 minutes pour un niveau de collège identifié.</li><li>Articulez un objectif de communication, un objectif grammatical, une réflexion ou explicitation, un entraînement et un réemploi.</li><li>Rédigez les consignes exactes et les supports nécessaires.</li><li>Anticipez une difficulté grammaticale, un malentendu et une aide pour un élève qui ne démarre pas.</li><li>Prévoyez une vérification individuelle et justifiez vos choix.</li></ol>`, 'Une fiche de préparation, les supports et une justification d’environ dix lignes.', 'Alignement objectifs-tâches ; modalités justifiées ; consignes utilisables ; indices d’apprentissage individuels.')+`<section class="activity-redesign" aria-labelledby="redesign-title"><div class="activity-redesign__head"><span class="activity-redesign__number">05</span><div><h3 id="redesign-title">Reconcevoir une activité</h3><p>Du simple exercice à une situation d’apprentissage contextualisée</p></div></div><div class="activity-redesign__body"><div class="activity-redesign__source"><p class="activity-redesign__eyebrow">Situation de départ</p><blockquote class="activity-redesign__quote" lang="en">“Put the verbs in the correct form.”</blockquote><p class="activity-redesign__note">Une consigne d’exercice isolée, sans contexte ni finalité de communication explicite.</p></div><div class="activity-redesign__task"><h4>Votre défi de conception</h4><p>Transformez cette consigne en une activité adaptée à une classe de collège. Précisez le contexte culturel et les apprentissages visés, puis expliquez comment les élèves passeront de la découverte au réemploi.</p><ul class="activity-redesign__list"><li>Objectif grammatical et de communication</li><li>Contexte culturel</li><li>Découverte ou explicitation</li><li>Entraînement guidé</li><li>Réemploi en situation</li><li>Indice d’apprentissage individuel</li></ul></div></div></section><section class="panel"><h2>Fiche de préparation · Articuler les trois dimensions</h2><div class="triad"><div><b>Grammaire</b><span>Que faire comprendre et utiliser ?</span></div><div><b>Formes de travail</b><span>Comment organiser l’activité de chacun ?</span></div><div><b>Consignes</b><span>Comment rendre la tâche compréhensible ?</span></div></div><div class="subgrid">${field('m5-level','Niveau et contexte','Classe, support, place du segment dans la séquence.',3)}${field('m5-goals','Objectifs de communication et grammatical','Formulez deux objectifs distincts et observables.',3)}</div><div class="table-wrap"><table class="tbl"><thead><tr><th>Étape et durée</th><th>Activité réelle des élèves</th><th>Modalité et justification</th><th>Consigne exacte</th><th>Aide prévue</th><th>Indice d’apprentissage</th></tr></thead><tbody>${Array.from({length:4},(_,i)=>`<tr>${['step','pupils','mode','instruction','support','evidence'].map((k,j)=>`<td><textarea data-answer="m5-${i}-${k}" aria-label="Étape ${i+1} : ${k}" placeholder="${j===0?'Phase / min':'À compléter…'}"></textarea></td>`).join('')}</tr>`).join('')}</tbody></table></div>${field('m5-material','Supports nécessaires','Rédigez ici un court dialogue, un document, des questions ou un autre support exploitable.',5)}${field('m5-obstacles','Difficulté grammaticale, malentendu et étayage','Distinguez un obstacle linguistique d’un obstacle lié à la consigne.',4)}${field('m5-individual','Vérification individuelle finale','Que pourra-t-on affirmer sur les acquis de chaque élève ? Que restera-t-il à vérifier ?',4)}${field('m5-rationale','Justification didactique (environ dix lignes)','Expliquez vos arbitrages en vous appuyant sur les analyses précédentes.',6)}${feedback('m5',`<ul><li>Le segment peut être une consolidation : une nouvelle découverte grammaticale n’est pas obligatoire.</li><li>Une tâche de réemploi doit avoir un enjeu de communication identifiable.</li><li>Une production collective ne suffit pas à documenter les acquis individuels.</li><li>Vérifiez la faisabilité des temps et l’accessibilité des supports.</li></ul>`)}</section>`}
function m6(){return intro('Conscientiser ses choix, réviser une préparation et préparer un protocole d’observation en stage.','Vos réponses initiales de la mission 1 et votre fiche de préparation de la mission 5.',`<ol><li>Relisez vos trois prises de position initiales et explicitez ce qui a évolué ou s’est nuancé.</li><li>Relisez votre fiche comme un tuteur : identifiez ses points de fragilité.</li><li>Modifiez au moins un élément : conservez la version initiale et justifiez la version révisée.</li><li>Élaborez un mini-protocole d’observation ou d’essai pour le prochain stage.</li><li>Terminez par un billet de sortie en quatre phrases.</li></ol>`, 'Une analyse réflexive, une modification justifiée, un protocole et un billet de sortie.', 'Révision fondée sur des critères ; prise en compte des limites ; transfert réalisable et observable.')+`<section class="panel"><h2>A. Retour sur mes représentations</h2><div class="doc"><h4>Mes réponses initiales</h4>${['m1-belief1','m1-belief2','m1-belief3'].map((k,i)=>`<p><strong>Affirmation ${i+1} :</strong> ${esc(data.answers[k]||'Non renseignée')}</p>`).join('')}</div>${field('m6-beliefs','Quelles positions maintenez-vous ou nuancez-vous ?','Appuyez chaque évolution sur une activité précise du parcours.',6)}</section><section class="panel"><h2>B. Autoconfrontation à ma fiche </h2><div class="instruction"><h3>Questions pour relire votre préparation</h3><ol><li>Où les élèves réfléchissent-ils réellement au fonctionnement de la langue ?</li><li>Où chaque élève produit-il quelque chose ?</li><li>Quelle modalité sert l’objectif ? Laquelle relève surtout d’une habitude ?</li><li>Quelle consigne risque de provoquer un malentendu ?</li><li>Que ne pourrez-vous pas conclure de la production finale ?</li></ol></div>${field('m6-self','Analyse critique de ma préparation','Répondez aux cinq questions en vous appuyant sur votre fiche.',6)}<div class="subgrid">${field('m6-before','Élément initial à modifier','Citez votre formulation ou votre organisation initiale.',4)}${field('m6-after','Version révisée','Écrivez une nouvelle version directement exploitable.',4)}</div>${field('m6-why','Pourquoi cette modification ?','Justifiez-la au regard des apprentissages visés et des limites identifiées.',4)}</section><section class="panel"><h2>C. Mini-protocole de stage </h2>${field('m6-plan','Ce que je souhaite observer ou tester','Formulez un objet d’observation limité et réaliste.',3)}${field('m6-hypothesis','Mon hypothèse','Quelle relation supposez-vous entre un choix pédagogique et un effet observable ?',3)}${field('m6-evidence','Les indices et traces que je recueillerai','Définissez des indicateurs précis, compatibles avec les règles de confidentialité.',3)}${field('m6-adjust','Ce que je pourrais modifier','Prévoyez une adaptation si l’effet attendu n’est pas observé.',3)}</section><section class="panel"><h2>D. Billet de sortie </h2>${field('m6-exit','Complétez les quatre phrases','Une distinction que je comprends mieux… / Un automatisme que je veux interroger… / Un choix que je peux justifier… / Une question pour le retour de stage…',5)}${feedback('m6',`<ul><li>La réflexion professionnelle n’exige pas de changer systématiquement d’avis : une position maintenue peut être mieux argumentée.</li><li>La révision doit être visible et justifiée, pas seulement annoncée.</li><li>Le protocole distingue hypothèse, observation et preuve ; il ne présuppose pas le résultat.</li></ul>`)}</section>`}
function caseHome(){return `<div class="back"><button class="btn secondary" data-next="home">← Accueil</button></div><header class="mission-head"><span class="meta">BANQUE COMPLÉMENTAIRE · RESSOURCES COMPLÉMENTAIRES · FACULTATIVES</span><h1>Observatoire des pratiques de classe</h1><p>Six dossiers fictifs documentés. À mobiliser pour approfondir une mission ou lors du retour en présentiel. Ils ne sont pas des observations authentiques.</p></header><div class="case-grid" style="margin-top:20px">${CASES.map((c,i)=>`<article class="case"><span class="kicker">Dossier ${i+1} · ${esc(c.level)}</span><h3>${esc(c.title)}</h3><p>${esc(c.focus)}</p><button class="btn secondary" data-open-case="${i}">Examiner le dossier →</button></article>`).join('')}</div>`}
function caseView(i){let c=CASES[i];return `<div class="back"><button class="btn secondary" data-next="cases">← Tous les dossiers</button></div><header class="mission-head"><span class="meta">DOSSIER FICTIF ${i+1} · ${esc(c.level)}</span><h1>${esc(c.title)}</h1><p>${esc(c.focus)}</p></header>${intro('Construire une interprétation étayée à partir de traces de classe.','Contexte, verbatim reconstitué et productions simulées.',`<ol><li>Citez deux faits observables.</li><li>Formulez deux hypothèses concurrentes et une manière de les départager.</li><li>Identifiez ce que les traces permettent ou non de conclure sur les apprentissages.</li><li>Proposez un ajustement didactique justifié.</li><li>Définissez un indice à recueillir lors d’une nouvelle observation.</li></ol>`,'Une analyse argumentée en cinq parties.','Distinguer faits, hypothèses et preuves ; contextualiser les propositions.') }<section class="panel"><h2>Pièces du dossier</h2><div class="doc"><h4>Contexte</h4><p>${esc(c.context)}</p><p><strong>Objectif :</strong> ${esc(c.objective)}</p><p><strong>Dilemme :</strong> ${esc(c.dilemma)}</p></div><div class="doc"><h4>Pièce 1 · Verbatim reconstitué</h4>${c.transcript.map(([s,t])=>`<div class="quote-row"><b>${esc(s)}</b> ${esc(t)}</div>`).join('')}</div><div class="doc"><h4>Pièce 2 · Traces simulées</h4><div class="table-wrap"><table class="tbl"><tbody>${c.traces.map(([s,t])=>`<tr><th>${esc(s)}</th><td>${esc(t)}</td></tr>`).join('')}</tbody></table></div></div></section><section class="panel"><h2>Votre analyse</h2>${[['facts','1. Faits observables','Citez des indices précis, sans les interpréter.'],['hypotheses','2. Hypothèses concurrentes','Proposez deux explications plausibles.'],['learning','3. Apprentissages et limites de preuve','Que peut-on et ne peut-on pas affirmer ?'],['decision','4. Ajustement didactique','Précisez l’action, ses raisons et un compromis.'],['evidence','5. Vérification et transfert','Quelle trace supplémentaire recueillir ?']].map(([k,t,h])=>field('case'+i+'-'+k,t,h,4)).join('')}${feedback('case'+i,`<p><strong>Éléments d’analyse :</strong></p><ul>${c.analysis.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><p><strong>Alternatives :</strong> ${c.alternatives.map(esc).join(' ; ')}.</p><p class="hint">Références indicatives : ${esc(c.refs)}</p>`)}</section>`}
function liaison(){return `<div class="back"><button class="btn secondary" data-next="home">← Retour au parcours</button></div><header class="mission-head"><span class="meta">DOCUMENT À COMPLÉTER À LA FIN DE LA SÉANCE</span><h1>Fiche de liaison · Distanciel / présentiel</h1><p>Cette fiche figure au début du livret pour permettre au formateur de préparer le feedback. Elle rassemble vos choix, vos hésitations et les questions à discuter.</p></header><section class="panel"><h2>Préparer la prochaine séance</h2>${field('liaison-choice','1. Mon choix à défendre','Sélectionnez un choix didactique de votre préparation et justifiez-le en cinq lignes maximum.',4)}${field('liaison-before','2. Ma consigne avant / après','Recopiez la consigne initiale, la version révisée et expliquez ce qui a changé.',5)}${field('liaison-tension','3. Mon point de tension','Formulez une difficulté professionnelle pour laquelle plusieurs réponses sont possibles.',4)}${field('liaison-evolution','4. Ce que j’ai fait évoluer','Au début, je pensais que… Maintenant, je préciserais que… (ou justifiez le maintien de votre position).',4)}${field('liaison-group','5. Ce que je souhaite soumettre au groupe','Citez un passage précis de votre travail et la question que vous souhaitez discuter.',4)}</section><section class="panel"><h2>Préparer le dépôt</h2><p>Vérifiez votre livret complété, puis déposez-le sur le <strong>Digipad indiqué par votre formateur</strong>. Cette application ne transmet pas vos réponses automatiquement.</p><div class="actions"><a class="btn" href="TEACHER_LAB_Livret_Etudiant_V8.docx" download>↓ Livret modifiable</a><a class="btn secondary" href="TEACHER_LAB_Livret_Etudiant_V8.pdf" download>↓ Livret imprimable</a><button class="btn dark" data-next="portfolio">Consulter mes réponses →</button></div></section>`}
function portfolio(){let answers=Object.keys(data.answers).filter(k=>String(data.answers[k]).trim()).length;return `<header class="mission-head"><span class="meta">DOCUMENT UNIQUE DE FORMATION</span><h1>Mon portfolio de décisions didactiques</h1><p>Téléchargez le livret de référence, relisez vos productions et préparez un document unique à déposer sur Digipad.</p></header><div class="stats"><div class="stat"><strong>${Object.values(data.done).filter(Boolean).length} / 6</strong><small>Missions validées</small></div><div class="stat"><strong>${answers}</strong><small>Champs renseignés</small></div><div class="stat"><strong>1</strong><small>Dépôt final</small></div></div><section class="panel"><h2>Livret et dépôt sur Digipad</h2><p>Complétez le livret DOCX ou sa version imprimée. Déposez un seul document lisible sur le Digipad indiqué par votre formateur : DOCX, PDF ou scan. L’export depuis cette application est une aide complémentaire, pas un dépôt automatique.</p><div class="actions"><a class="btn" href="TEACHER_LAB_Livret_Etudiant_V8.docx" download>↓ Livret DOCX</a><a class="btn secondary" href="TEACHER_LAB_Livret_Etudiant_V8.pdf" download>↓ Livret PDF</a><button class="btn secondary" data-next="liaison">✦ Fiche de liaison</button></div>${field('identity','Nom ou identifiant universitaire','Facultatif dans l’application ; complétez selon les consignes de votre enseignant.',2)}<p class="hint">Avant export, vérifiez particulièrement les missions 5 et 6 : fiche de préparation, version initiale, version révisée et justification.</p><div class="actions"><button class="btn" id="printPortfolio">Imprimer mes réponses / PDF</button><button class="btn secondary" id="exportText">Exporter mes réponses (.html)</button><button class="btn secondary" id="backup">Sauvegarde (.json)</button><button class="btn secondary" id="import">Importer une sauvegarde</button></div></section><section class="panel"><h2>Mes productions</h2>${MISSIONS.map((m,i)=>`<div class="doc"><h4>Mission ${i+1} · ${esc(m[0])}</h4><p>${Object.entries(data.answers).filter(([k,v])=>k.startsWith('m'+(i+1)+'-')&&String(v).trim()).length} réponses enregistrées · ${data.done[i]?'Mission validée':'À compléter'}</p><button class="btn secondary" data-next="m${i}">Relire / modifier →</button></div>`).join('')}</section>`}
function resources(){return `<header class="mission-head"><span class="meta">DOCUMENTATION</span><h1>Cadre institutionnel et ressources didactiques</h1><p>Distinguez les textes prescriptifs, les ressources institutionnelles d’accompagnement et les propositions didactiques.</p></header><section class="panel resource"><h2>Références à consulter</h2><p><strong>Programmes d’anglais du collège :</strong> <a target="_blank" rel="noopener" href="https://www.education.gouv.fr/bo/2025/Hebdo22/MENE2504621A">Bulletin officiel, 2025</a>.</p><p><strong>Ressources d’accompagnement :</strong> <a target="_blank" rel="noopener" href="https://eduscol.education.gouv.fr/4758/ressources-d-accompagnement-pour-les-langues-vivantes-etrangeres-et-regionales-au-college">Éduscol · langues vivantes</a>.</p><p><strong>CECRL :</strong> <a target="_blank" rel="noopener" href="https://www.coe.int/fr/web/common-european-framework-reference-languages">Conseil de l’Europe</a>.</p><p><strong>Référentiel des compétences professionnelles :</strong> <a target="_blank" rel="noopener" href="https://www.legifrance.gouv.fr/eli/arrete/2013/7/1/MENE1315928A/jo/texte">Arrêté du 1er juillet 2013</a>.</p><p><strong>Enseignement de la grammaire :</strong> <a target="_blank" rel="noopener" href="https://africa.teachingenglish.org.uk/skills/tips/teaching-grammar-indirectly">British Council · démarches inductives</a>.</p><p><strong>Modalités d’interaction :</strong> <a target="_blank" rel="noopener" href="https://www.teachingenglish.org.uk/professional-development/teachers/teaching-knowledge-database/d-h/interaction-patterns">British Council · interaction patterns</a>.</p><p><strong>Consignes et travail en binômes :</strong> <a target="_blank" rel="noopener" href="https://www.teachingenglish.org.uk/teaching-resources/teaching-primary/activities/level-1/working-pairs-and-groups">British Council · working in pairs and groups</a>.</p><p class="hint">Les liens renvoient à des documents de statuts différents. Vérifiez la
